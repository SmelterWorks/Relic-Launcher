name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (example 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  prepare:
    name: prepare-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and ensure tag
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

  publish:
    name: publish (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish src/RelicLauncher.App/RelicLauncher.App.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:Version="$VERSION" \
            -o "artifacts/${RID}"
          case "$RID" in
            win-x64)
              chmod +x packaging/create-zip.sh
              packaging/create-zip.sh "relic-launcher-${VERSION}-${RID}.zip" "artifacts/${RID}"
              ;;
            osx-x64|osx-arm64)
              chmod +x packaging/macos/build-app-bundle.sh
              packaging/macos/build-app-bundle.sh \
                --version "$VERSION" \
                --publish-dir "artifacts/${RID}" \
                --output-dir . \
                --rid "$RID"
              ;;
            *)
              (cd "artifacts/${RID}" && tar -czf "../../relic-launcher-${VERSION}-${RID}.tar.gz" .)
              ;;
          esac

      - name: Install packaging tools
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd libarchive-tools file

      - name: Package Linux
        if: matrix.rid == 'linux-x64'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x packaging/linux/build-packages.sh
          packaging/linux/build-packages.sh \
            --version "$VERSION" \
            --publish-dir "artifacts/linux-x64" \
            --output-dir packages

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: |
            relic-launcher-*.tar.gz
            relic-launcher-*.zip
            relic-launcher-*.app.zip
            packages/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: github-release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Relic Launcher ${VERSION}" \
            --generate-notes \
            --verify-tag
