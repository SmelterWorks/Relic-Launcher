name: Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  changes:
    name: check-commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      stamp: ${{ steps.decide.outputs.stamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d)"
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --since="24 hours ago" --oneline | grep -q .; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          STAMP: ${{ needs.changes.outputs.stamp }}
        run: |
          set -euo pipefail
          VERSION="0.0.0-nightly.${STAMP}"
          dotnet publish src/RelicLauncher.App/RelicLauncher.App.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:Version="$VERSION" \
            -o "artifacts/${RID}"
          case "$RID" in
            win-x64)
              chmod +x packaging/create-zip.sh
              packaging/create-zip.sh "relic-launcher-nightly-${STAMP}-${RID}.zip" "artifacts/${RID}"
              ;;
            osx-x64|osx-arm64)
              chmod +x packaging/macos/build-app-bundle.sh
              packaging/macos/build-app-bundle.sh \
                --version "$VERSION" \
                --publish-dir "artifacts/${RID}" \
                --output-dir . \
                --rid "$RID"
              mv "relic-launcher-${VERSION}-${RID}.app.zip" "relic-launcher-nightly-${STAMP}-${RID}.app.zip"
              ;;
            *)
              (cd "artifacts/${RID}" && tar -czf "../../relic-launcher-nightly-${STAMP}-${RID}.tar.gz" .)
              ;;
          esac

      - name: Install packaging tools
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd libarchive-tools file flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Platform.GL.default//24.08

      - name: Package Linux
        if: matrix.rid == 'linux-x64'
        env:
          VERSION: "0.0.0-nightly.${{ needs.changes.outputs.stamp }}"
        run: |
          chmod +x packaging/linux/build-packages.sh
          packaging/linux/build-packages.sh \
            --version "$VERSION" \
            --publish-dir "artifacts/linux-x64" \
            --output-dir .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.rid }}
          path: |
            relic-launcher-nightly-*.tar.gz
            relic-launcher-nightly-*.zip
            relic-launcher-nightly-*.app.zip
            relic-launcher-*.deb
            relic-launcher-*.rpm
            relic-launcher-*.pkg.tar.zst
            relic-launcher-*.AppImage
            relic-launcher-*.flatpak
          if-no-files-found: error
          retention-days: 7

  prerelease:
    name: prerelease
    needs: [changes, publish]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.changes.outputs.stamp }}
        run: |
          set -euo pipefail
          TAG="nightly-${STAMP}-run${GITHUB_RUN_NUMBER}"
          mapfile -t ASSETS < <(find dist -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found under dist/" >&2
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly ${STAMP} (run ${GITHUB_RUN_NUMBER})" \
            --notes "Automated nightly build for ${STAMP}, workflow run ${GITHUB_RUN_NUMBER}." \
            --prerelease
