name: Feature request
description: Propose a concrete change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Relic Launcher do instead?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Platforms, UI surfaces, or APIs this would touch.
